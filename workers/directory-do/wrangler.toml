name = "loop-safe-directory-do"
main = "src/index.js"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat_v2"]
account_id = "<CLOUDFLARE_ACCOUNT_ID>"

[observability]
enabled = true

# Read the live directory rows so a slug can resolve to its directory target.
[[d1_databases]]
binding = "DB"
database_name = "loop-content-spine"
database_id = "298eb858-37fb-4c73-8be4-135e8feb73fe"

# The bound Durable Object. DirectoryDO = single strongly-consistent writer:
# slug registry + append-only mutation-intent log. SQLite-backed.
[[durable_objects.bindings]]
name = "DIRECTORY_DO"
class_name = "DirectoryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DirectoryDO"]
