name = "miscsubjects-pages"
pages_build_output_dir = "public"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "miscsubjects-content"
database_id = "298eb858-37fb-4c73-8be4-135e8feb73fe"

[[d1_databases]]
binding = "LEDGER"
database_name = "miscsubjects-events"
database_id = "6fe246a1-5a37-4bfa-94ba-f953ee5bdf60"

[[kv_namespaces]]
binding = "KV"
id = "58b303e666a8431685624e0cfd2fd63f"

[[r2_buckets]]
binding = "R2"
bucket_name = "miscsubjects-ledger"

[ai]
binding = "AI"

# Bound Durable Object: DirectoryDO (class) lives in the miscsubjects-directory-do Worker.
# Deploy that Worker BEFORE the next Pages deploy or this binding errors (script must exist).
[[durable_objects.bindings]]
name = "DIRECTORY_DO"
class_name = "DirectoryDO"
script_name = "miscsubjects-directory-do"

# One Durable Object per sheet (workers/sheet-do). Single writer per sheet, SQLite-local
# reads, WebSocket push, R2 spill for oversized cells. Deploy that Worker BEFORE the next
# Pages deploy or this binding errors (script must exist).
[[durable_objects.bindings]]
name = "SHEET_DO"
class_name = "SheetDO"
script_name = "miscsubjects-sheet-do"

[[queues.producers]]
binding = "TASKS"
queue = "miscsubjects-tasks"

# Bound storage Worker (miscsubjects-storage): owns reference sprawl in R2 + a D1 index,
# fronted by functions/api/store/[[path]].js. Deploy that Worker BEFORE the next Pages
# deploy or this binding errors (script must exist).
[[services]]
binding = "STORE"
service = "miscsubjects-storage"

# Meta owner module. miscsubjects-meta-bridge binds the shared Secrets Store Meta token by
# reference and fronts the Graph API. Deploy that Worker (workers/meta-bridge) BEFORE
# the next Pages deploy or this binding errors (script must exist).
[[services]]
binding = "META_BRIDGE"
service = "miscsubjects-meta-bridge"


# Secrets live as per-Pages env vars (wrangler 4.99 rejects [[secrets_store_secrets]] for Pages).

# Preview deployments must never write to production D1. Pages env overrides are
# non-inheritable, so every binding used by the Functions runtime is repeated here.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "miscsubjects-content-preview"
database_id = "373bd467-1afe-418c-b48b-9972370b8347"

[[env.preview.d1_databases]]
binding = "LEDGER"
database_name = "miscsubjects-events-preview"
database_id = "b1e9727f-ec1e-4f40-a96d-aa2c6b9597ac"

[[env.preview.kv_namespaces]]
binding = "KV"
id = "58b303e666a8431685624e0cfd2fd63f"

[[env.preview.r2_buckets]]
binding = "R2"
bucket_name = "miscsubjects-ledger"

[env.preview.ai]
binding = "AI"

[[env.preview.durable_objects.bindings]]
name = "DIRECTORY_DO"
class_name = "DirectoryDO"
script_name = "miscsubjects-directory-do"

[[env.preview.durable_objects.bindings]]
name = "SHEET_DO"
class_name = "SheetDO"
script_name = "miscsubjects-sheet-do"

[[env.preview.queues.producers]]
binding = "TASKS"
queue = "miscsubjects-tasks"

[[env.preview.services]]
binding = "STORE"
service = "miscsubjects-storage"

[[env.preview.services]]
binding = "META_BRIDGE"
service = "miscsubjects-meta-bridge"
