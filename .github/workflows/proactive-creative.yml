name: proactive-creative
on:
  # Disabled to stop GitHub notification noise. Re-enable by restoring the schedule block.
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: wake /api/proactive
        run: |
          curl -s -X POST https://miscsubjects.com/api/proactive \
            -H "x-loop-auth: ${{ secrets.LOOP_DELIVER_TOKEN }}" \
            -o /dev/null -w "proactive wake: %{http_code}\n"
