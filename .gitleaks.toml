# Generated by scripts/publish-mirror.mjs. Known non-secrets and why each is not a credential.
[extend]
useDefault = true

[allowlist]
regexTarget = "line"
regexes = [
  # IndexNow keys are published by protocol design: the site serves the key file at a public URL so search engines can verify ownership
  '''INDEXNOW_KEY\s*=\s*"[0-9a-f]{32}"''',
  # redaction test fixture: a placeholder header value the test expects to see redacted
  '''x-terminal-key: 0a1b2c''',
  # directory row auth spec names the ENVIRONMENT VARIABLE that holds the credential, not the credential
  '''auth='bearer:[A-Z_]+''',
  # prose in a disclosure string
  '''bearer credential (withheld|is exposed)''',
]
